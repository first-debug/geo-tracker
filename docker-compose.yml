# Запуск geotracker на сервере с GPU NVIDIA.
#   docker compose up -d --build   — собрать образ и запустить
#   docker compose logs -f         — логи
#   docker compose down            — остановить
# Подробности — docs/deploy.md.

name: geotracker

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        DS_IMAGE: ${DS_IMAGE:-nvcr.io/nvidia/deepstream:9.0-triton-multiarch}
        DSYOLO_REF: ${DSYOLO_REF:-master}
        GIT_SHA: ${GIT_SHA:-unknown}
    image: geotracker:${APP_VERSION:-latest}
    command: ["/app/configs/${APP_CONFIG:-app.ini}"]
    restart: unless-stopped
    # Камеры (RTSP/RTP), видеовыход и получатель UDP — в локальной сети;
    # сеть хоста избавляет от проброса динамических портов RTP.
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, video]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      GST_DEBUG: ${GST_DEBUG:-1}
      TZ: ${TZ:-Europe/Moscow}
      # Пороги healthcheck; путь к heartbeat-файлу должен совпадать с
      # [health] heartbeat-file в app.ini
      HEALTH_FILE: /tmp/geotracker-health
      HEALTH_MAX_FRAME_AGE_SEC: ${HEALTH_MAX_FRAME_AGE_SEC:-60}
    volumes:
      - ./configs:/app/configs:ro
      - ./models:/app/models
    # После SIGTERM приложение отправляет EOS (до 3 с) и останавливает
    # конвейер (до 10 с); запас, чтобы Docker не убил его раньше.
    stop_signal: SIGTERM
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
