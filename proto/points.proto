// Формат UDP-сообщений geotracker.
//
// Каждая UDP-датаграмма — ровно одно сообщение Batch в двоичном формате
// protobuf, без дополнительных заголовков. Датаграммы независимы: потеря
// одной не мешает разобрать остальные, а пропуск в Batch.sequence
// показывает, сколько датаграмм потеряно.
syntax = "proto3";

package geotracker;

// Рамка объекта в пикселях кадра, который видит детектор
message BBox {
  int32 x1 = 1;
  int32 y1 = 2;
  int32 x2 = 3;
  int32 y2 = 4;
}

// Объект на кадре
message Detection {
  // географические координаты точки касания объекта с землёй, градусы WGS 84
  double lat = 1;
  double lng = 2;
  // id трека nvtracker, -1 — объект не отслеживается
  sint64 object_id = 3;
  string name = 4;
  float confidence = 5;
  BBox bbox = 6;
}

// Результат обработки одного кадра одной камеры.
// Кадр без объектов тоже передаётся: камера работает, но ничего не видит.
// Если объекты кадра не помещаются в одну датаграмму, кадр делится на
// несколько Frame с одинаковыми camera_id и timestamp.
message Frame {
  // номер камеры, как в группах [cameraN] конфига
  uint32 camera_id = 1;
  // время кадра, секунды Unix-эпохи
  double timestamp = 2;
  repeated Detection detections = 3;
}

message Batch {
  // номер датаграммы с запуска приложения: 0, 1, 2, ...
  // Сброс в 0 означает перезапуск отправителя.
  uint64 sequence = 1;
  // время отправки, секунды Unix-эпохи
  double sent_at = 2;
  // кадры в порядке поступления
  repeated Frame frames = 3;
}
